name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require the npm bootstrap
        run: |
          package=$(node -p "require('./package.json').name")
          if ! npm view "$package" version >/dev/null 2>&1; then
            echo "::error::Package $package does not exist on npm yet. Complete the one-time bootstrap in RELEASING.md, then configure its trusted publisher."
            exit 1
          fi
      - name: Check bundle
        run: npm test
      - name: Publish with OIDC and provenance
        run: npm publish --provenance
